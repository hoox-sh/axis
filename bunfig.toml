#
# Bun test config for AXIS.
#
# Bare `bun test` (no path args) discovers *.test.ts / *.spec.ts from the repo
# root. Playwright specs under e2e/ use @playwright/test and must NOT run under
# Bun — they throw "Playwright Test did not expect test.describe()…".
#
# Safe paths:
#   bun run test       → tests/ + worker/tests/ (package.json)
#   bun run test:unit  → tests/ only
#   bun test           → same unit discovery after pathIgnorePatterns
#   bun run test:e2e*  → Playwright via playwright.config.ts (not Bun)

[test]
# Exclude Playwright e2e from Bun discovery (matched dirs are pruned).
# packages/* ship their own test scripts (axis-cli needs its node_modules).
pathIgnorePatterns = [
  "e2e/**",
  "playwright-report/**",
  "test-results/**",
  "packages/**",
]
# Pin solid-js to its development build for the whole run. `jsxDEV` only exists in
# dist/dev.js (the `browser` + `development` export condition); Bun's test
# resolver otherwise picks dist/solid.js and every test reaching a `.tsx` fails
# with "Export named 'jsxDEV' not found". Root-level `conditions` does not affect
# Bun 1.4.3's runtime resolver — hence the preload plugin.
preload = ["./tests/helpers/mock-solid.ts"]

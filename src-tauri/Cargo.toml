[package]
name = "axis"
version = "2.4.0"
description = "AXIS — open charting desktop app: CEX data, drawings, on-chain, PYNE (HOOX)"
authors = ["jango_blockchained"]
license = "AGPL-3.0-only"
repository = "https://github.com/hoox-sh/axis"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "axis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"

# Codecov configuration — hoox-sh/axis
# Local gate: `bun run test:coverage:gate` enforces 95% (scripts/check-coverage.mjs).
# Codecov project target is 75%: Codecov's denominator spans everything
# exercised in CI (app + worker + CLI), which sits ~75%; the stricter 95%
# floor stays local via check-coverage.mjs.

codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 75%
    patch:
      default:
        target: 80%

flags:
  unit:
    carryforward: true
  cli:
    carryforward: true

ignore:
  - "vendor/"
  - "pyodide/"
  - "public/"
  - "e2e/"
  - "src-tauri/"
  - "docs/"
  - "brand/"
  - "examples/"
  - "scripts/"
  - "**/coverage/"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

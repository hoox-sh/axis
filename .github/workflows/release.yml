# npm release for the AXIS CLI (`packages/cli` → @hoox-sh/axis-cli).
#
# Triggers on version tags (v*) and workflow_dispatch. Requires the
# org secret `NPM_TOKEN_HOOXSH` (automation token with publish rights
# for the @hoox-sh scope). Skips cleanly when the package version is
# already on the registry, so re-running a tag never fails.
#
# Other v* tag components (not this workflow):
#   - Desktop installers + GitHub Release: .github/workflows/desktop.yml
#   - GHCR images:                       .github/workflows/docker.yml
# Worker / Pages stay operator-driven (`axis deploy all`) — they need
# Cloudflare credentials that are not in this job.

name: Release (npm)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    name: Publish @hoox-sh/axis-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: bun install --frozen-lockfile

      - name: Typecheck + test + build
        working-directory: packages/cli
        run: |
          bun run typecheck
          bun test
          bun run build
          test -f dist/index.js
          test -f LICENSE

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check registry version
        id: check
        run: |
          PKG_VER=$(node -p "require('./packages/cli/package.json').version")
          REG_VER=$(npm view "@hoox-sh/axis-cli" version 2>/dev/null || true)
          echo "local=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "registry=${REG_VER:-<none>}" >> "$GITHUB_OUTPUT"
          if [ "${PKG_VER}" = "${REG_VER}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@hoox-sh/axis-cli@${PKG_VER} already published — will skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack dry-run
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/cli
        run: |
          npm pack --dry-run --json > /tmp/axis-cli-pack.json
          node -e '
            const p = require("/tmp/axis-cli-pack.json");
            const entry = Array.isArray(p)
              ? p[0]
              : p.files
                ? p
                : Object.values(p)[0];
            const files = (entry.files || []).map((f) => f.path || f);
            const need = ["bin/axis.js", "dist/index.js", "LICENSE", "README.md", "package.json"];
            const missing = need.filter((n) => !files.includes(n));
            if (missing.length) {
              console.error("npm pack missing:", missing.join(", "));
              console.error("have:", files.join(", "));
              process.exit(1);
            }
            console.log("pack files ok:", need.join(", "));
          '

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_HOOXSH }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Org secret NPM_TOKEN_HOOXSH is missing or not available to this repo."
            echo "Grant hoox-sh/axis access to NPM_TOKEN_HOOXSH (npm automation token for @hoox-sh)."
            exit 1
          fi
          npm publish --access public --provenance

      - name: Ensure public access
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_HOOXSH }}
        run: |
          # First scoped publish can land restricted; force public on the @hoox-sh org.
          npm access set status=public --package=@hoox-sh/axis-cli \
            || npm access public @hoox-sh/axis-cli
          PUB=$(npm view @hoox-sh/axis-cli version)
          echo "npm view @hoox-sh/axis-cli → ${PUB}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## npm release"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | [\`@hoox-sh/axis-cli\`](https://www.npmjs.com/package/@hoox-sh/axis-cli) |"
            echo "| Local version | \`${{ steps.check.outputs.local }}\` |"
            echo "| Registry version | \`${{ steps.check.outputs.registry }}\` |"
            echo "| Published | \`${{ steps.check.outputs.skip != 'true' && 'yes' || 'skipped (already published)' }}\` |"
            echo "| Tag | \`${{ github.ref_name }}\` |"
            echo ""
            echo "Same tag also drives desktop (GitHub Release) and Docker (GHCR) workflows."
            echo "Worker / Pages deploy remains \`axis deploy all\`."
          } >> "$GITHUB_STEP_SUMMARY"

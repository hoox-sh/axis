# Full npm release pipeline for the AXIS CLI (`packages/cli` → @hoox-sh/axis-cli).
#
# Triggers:
#   - tag push `v*`     → root release tags; publishes the CLI when its
#                         package version is missing from the registry, skips
#                         cleanly when already published (re-runs stay green).
#   - tag push `cli-v*` → explicit CLI-only release; the tag MUST equal
#                         `cli-v<packages/cli version>` or the job fails.
#   - workflow_dispatch → manual run; optional `force` re-attempts publish
#                         (idempotent tolerance keeps a retry green).
#
# Requires the org secret `NPM_TOKEN_HOOXSH` (automation token with publish
# rights for the @hoox-sh scope). Provenance needs the public repo +
# `id-token: write`.
#
# Pipeline: install → typecheck + test + build → tag/version guard →
# registry check → pack dry-run → publish (provenance, idempotent) →
# registry verify → Node smoke test of the published tarball → public
# access check → summary.
#
# Other v* tag components (not this workflow):
#   - Desktop installers + GitHub Release: .github/workflows/desktop.yml
#   - GHCR images:                       .github/workflows/docker.yml
# The `release-assets` job here attaches downloadable artifacts to the GitHub
# Release for `v*` tags: the CLI tarball (npm pack), a deployable worker source
# bundle, and SHA256SUMS. Existing tags can be backfilled via
# workflow_dispatch with the `tag` input. Worker / Pages deploy stays
# operator-driven (`axis deploy all`) — it needs Cloudflare credentials that
# are not in this job.

name: Release (npm)

on:
  push:
    tags: ['v*', 'cli-v*']
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-attempt publish even if the version is already on the registry'
        type: boolean
        default: false
      tag:
        description: 'Existing v* tag to (re)attach release assets to, e.g. v2.6.1'
        type: string
        required: false

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    name: Publish @hoox-sh/axis-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_HOOXSH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: bun install --frozen-lockfile

      - name: Typecheck + test + build
        working-directory: packages/cli
        run: |
          bun run typecheck
          bun test
          bun run build
          test -f dist/index.js
          test -f LICENSE
          test -x bin/axis.js

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Version + tag guard
        id: guard
        run: |
          PKG_VER=$(node -p "require('./packages/cli/package.json').version")
          echo "version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "tag_match=dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="${{ github.ref_name }}"
          if [[ "$REF" == "cli-v${PKG_VER}" ]]; then
            echo "tag_match=cli" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == cli-v* ]]; then
            echo "::error::Tag ${REF} must equal cli-v${PKG_VER} (packages/cli/package.json version). Bump the CLI version and re-tag."
            exit 1
          elif [[ "$REF" == "v${PKG_VER}" ]]; then
            echo "tag_match=root" >> "$GITHUB_OUTPUT"
          else
            echo "tag_match=other" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag ${REF} is a root release tag; @hoox-sh/axis-cli@${PKG_VER} publishes only if missing from the registry."
          fi

      - name: Check registry version
        id: check
        run: |
          PKG_VER="${{ steps.guard.outputs.version }}"
          # Authenticated view so a restricted first publish is still detected.
          REG_VER=$(npm view "@hoox-sh/axis-cli@$PKG_VER" version 2>/dev/null || true)
          echo "local=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "registry=${REG_VER:-<none>}" >> "$GITHUB_OUTPUT"
          if [ -n "${REG_VER}" ] && [ "${{ inputs.force || 'false' }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@hoox-sh/axis-cli@${PKG_VER} already published — will skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack dry-run
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/cli
        run: |
          npm pack --dry-run --json > /tmp/axis-cli-pack.json
          node -e '
            const p = require("/tmp/axis-cli-pack.json");
            const entry = Array.isArray(p)
              ? p[0]
              : p.files
                ? p
                : Object.values(p)[0];
            const files = (entry.files || []).map((f) => f.path || f);
            const need = ["bin/axis.js", "dist/index.js", "LICENSE", "README.md", "package.json"];
            const missing = need.filter((n) => !files.includes(n));
            if (missing.length) {
              console.error("npm pack missing:", missing.join(", "));
              console.error("have:", files.join(", "));
              process.exit(1);
            }
            console.log("pack files ok:", need.join(", "));
          '

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/cli
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Org secret NPM_TOKEN_HOOXSH is missing or not available to this repo."
            echo "Grant hoox-sh/axis access to NPM_TOKEN_HOOXSH (npm automation token for @hoox-sh)."
            exit 1
          fi
          set +e
          npm publish --access public --provenance
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if npm view "@hoox-sh/axis-cli@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Version already on the registry — treating publish as done."
            exit 0
          fi
          exit "$code"

      - name: Verify registry version
        id: verify
        run: |
          VER="${{ steps.guard.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            if npm view "@hoox-sh/axis-cli@$VER" version >/dev/null 2>&1; then
              echo "Registry confirmed: @hoox-sh/axis-cli@$VER"
              exit 0
            fi
            echo "waiting for registry propagation ($i/6)…"
            sleep 5
          done
          echo "::error::@hoox-sh/axis-cli@$VER not visible on the registry."
          exit 1

      - name: Smoke test published package (Node)
        id: smoke
        run: |
          set -e
          VER="${{ steps.guard.outputs.version }}"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          TGZ=""
          for i in 1 2 3 4 5 6; do
            TGZ="$(npm pack "@hoox-sh/axis-cli@$VER" --silent 2>/dev/null | tail -1 || true)"
            if [ -n "$TGZ" ] && [ -f "$TGZ" ]; then break; fi
            echo "waiting for tarball propagation ($i/6)…"
            sleep 5
          done
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "::error::Could not fetch @hoox-sh/axis-cli@$VER tarball from the registry."
            exit 1
          fi
          # Clean Node-only consumer: no Bun, no repo, no install scripts.
          npm install --no-save --ignore-scripts --no-audit --no-fund "$PWD/$TGZ" >/dev/null
          GOT="$(./node_modules/.bin/axis --version)"
          if [ "$GOT" != "$VER" ]; then
            echo "::error::axis --version printed '${GOT}', expected '${VER}'."
            exit 1
          fi
          ./node_modules/.bin/axis --help | grep -q "deploy"
          echo "Smoke OK: @hoox-sh/axis-cli@$VER runs on Node $(node --version)"

      - name: Ensure public access
        if: always() && steps.check.outcome == 'success'
        working-directory: packages/cli
        run: |
          if npm access set status=public @hoox-sh/axis-cli; then
            npm access get status @hoox-sh/axis-cli
          else
            echo "::warning::NPM_TOKEN_HOOXSH cannot change package visibility (403). If the listing is private, set Public at https://www.npmjs.com/package/@hoox-sh/axis-cli"
          fi
          PUB=$(npm view @hoox-sh/axis-cli version 2>/dev/null || true)
          echo "npm view @hoox-sh/axis-cli → ${PUB:-<none>}"

      - name: Summary
        if: always()
        run: |
          TM="${{ steps.guard.outputs.tag_match }}"
          case "$TM" in
            cli) TAG_LABEL="CLI release" ;;
            root) TAG_LABEL="root release" ;;
            dispatch) TAG_LABEL="manual dispatch" ;;
            *) TAG_LABEL="other" ;;
          esac
          PUBLISHED="${{ steps.check.outputs.skip != 'true' && 'yes' || 'skipped (already published)' }}"
          VERIFY="${{ steps.verify.outcome == 'success' && 'pass' || steps.verify.outcome || 'skipped' }}"
          SMOKE="${{ steps.smoke.outcome == 'success' && 'pass' || steps.smoke.outcome || 'skipped' }}"
          {
            echo "## npm release"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Package | [\`@hoox-sh/axis-cli\`](https://www.npmjs.com/package/@hoox-sh/axis-cli) |"
            echo "| Local version | \`${{ steps.check.outputs.local }}\` |"
            echo "| Registry version | \`${{ steps.check.outputs.registry }}\` |"
            echo "| Published | \`${PUBLISHED}\` |"
            echo "| Tag | \`${{ github.ref_name }}\` (${TAG_LABEL}) |"
            echo "| Registry verify | \`${VERIFY}\` |"
            echo "| Smoke (Node) | \`${SMOKE}\` |"
            echo ""
            echo "Same tag also drives desktop (GitHub Release) and Docker (GHCR) workflows."
            echo "Worker / Pages deploy remains \`axis deploy all\`."
          } >> "$GITHUB_STEP_SUMMARY"

  release-assets:
    name: Release assets (CLI tarball + worker bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Root release tags only — cli-v* tags carry no GitHub Release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release assets attach to v* tags only (got: ${TAG})."; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build + pack CLI tarball
        working-directory: packages/cli
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f dist/index.js
          CLI_VER=$(node -p "require('./package.json').version")
          npm pack --silent
          # GITHUB_WORKSPACE, not ../ — packages/cli/.. resolves to packages/.
          mv "hoox-sh-axis-cli-${CLI_VER}.tgz" "${GITHUB_WORKSPACE}/axis-cli-${CLI_VER}.tgz"
          echo "CLI_ASSET=axis-cli-${CLI_VER}.tgz" >> "$GITHUB_ENV"

      - name: Build worker source bundle
        run: |
          VER="${{ steps.tag.outputs.version }}"
          # Deployable worker snapshot: source + schemas + wrangler config
          # template, no installs / local state / secrets. wrangler.toml is
          # gitignored (axis setup generates it) — the .example ships instead.
          tar \
            --exclude=worker/node_modules \
            --exclude=worker/.wrangler \
            --exclude=worker/.dev.vars \
            -czf "axis-worker-${VER}.tar.gz" LICENSE worker/
          tar -tzf "axis-worker-${VER}.tar.gz" > /tmp/worker-list.txt
          grep -qx 'worker/wrangler.toml.example' /tmp/worker-list.txt
          grep -qx 'worker/src/index.ts' /tmp/worker-list.txt
          echo "WORKER_ASSET=axis-worker-${VER}.tar.gz" >> "$GITHUB_ENV"

      - name: Compile standalone binaries (bun build --compile)
        working-directory: packages/cli
        run: |
          bun run build:binaries
          ls -la dist-bin/
          NATIVE="dist-bin/axis-cli-$(node -p "require('./package.json').version")-bun-linux-x64"
          [ "$(./"$NATIVE" --version)" = "$(node -p "require('./package.json').version")" ]

      - name: Checksums
        run: |
          VER="${{ steps.tag.outputs.version }}"
          sha256sum "$CLI_ASSET" "$WORKER_ASSET" packages/cli/dist-bin/axis-cli-* > "SHA256SUMS-${VER}.txt"
          echo "SUMS_ASSET=SHA256SUMS-${VER}.txt" >> "$GITHUB_ENV"
          cat "SHA256SUMS-${VER}.txt"

      - name: Wait for the GitHub Release (created by desktop.yml)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for i in $(seq 1 36); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "waiting for release $TAG ($i/36)…"
            sleep 20
          done
          # Not created by desktop.yml (skipped / failed) — create it so the
          # artifacts still ship.
          gh release create "$TAG" --title "AXIS $TAG" --generate-notes ||
            gh release view "$TAG" >/dev/null

      - name: Upload assets
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" \
            "$CLI_ASSET" "$WORKER_ASSET" "$SUMS_ASSET" \
            packages/cli/dist-bin/axis-cli-* \
            --clobber

      - name: Verify assets on the release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          for f in "$CLI_ASSET" "$WORKER_ASSET" "$SUMS_ASSET" packages/cli/dist-bin/axis-cli-*; do
            grep -qx "$(basename "$f")" /tmp/assets.txt || {
              echo "::error::Asset $(basename "$f") missing from release $TAG."
              exit 1
            }
          done

      - name: Summary
        if: always()
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "## release assets"
            echo ""
            echo "| Asset | Purpose |"
            echo "|-------|---------|"
            echo "| \`${CLI_ASSET:-<none>}\` | offline install: \`npm i -g ./axis-cli-*.tgz\` |"
            echo "| \`packages/cli/dist-bin/axis-cli-*\` | single-file binaries (bun compile): linux x64/arm64 + musl, macOS x64/arm64, Windows x64 |"
            echo "| \`${WORKER_ASSET:-<none>}\` | deployable worker source snapshot (\`wrangler deploy\`) |"
            echo "| \`${SUMS_ASSET:-<none>}\` | sha256 checksums |"
            echo ""
            echo "Tag: \`${TAG}\` — https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

# AXIS CI — unit + security + Playwright smoke on every PR / main push.
# Optional firehose bench is not run here (AXIS_BENCH=1 locally / nightly only).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck + unit + security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Release versions in sync
        run: bun scripts/check-versions.mjs

      - name: Unit + worker tests (coverage)
        run: bun run test:coverage

      - name: Security suites
        run: bun run test:security

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: bun install --frozen-lockfile

      - name: CLI typecheck + test (coverage)
        working-directory: packages/cli
        run: |
          bun run typecheck
          bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload CLI coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: packages/cli/coverage/lcov.info
          flags: cli
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Playwright @smoke
        run: bun run test:e2e:smoke
        env:
          CI: true

      - name: Upload Playwright failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

# Build AXIS Tauri 2 desktop bundles on every push to main (and on PRs that
# touch desktop/frontend). Uploads platform artifacts for download; publishes a
# GitHub Release when the push is a version tag (v* / desktop-v*).

name: Desktop (Tauri)

on:
  push:
    branches: [main]
    tags: ['v*', 'desktop-v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No workflow-level permissions: each job declares the minimum it needs
# (G15). The build job keeps contents:write because tauri-action attaches
# bundles to the GitHub Release on version tags; non-tag builds only read.
# NOTE: tauri-action is pinned to the mutable @v0 major tag. SHA-pinning to an
# immutable commit needs network access to resolve SHAs — left as a manual
# follow-up (verify with actionlint --verify when pinning).

jobs:
  build:
    # Release attach (tags) needs contents:write; plain builds only read.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            artifact: linux
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
          - platform: windows-latest
            args: ''
            artifact: windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Release versions in sync
        run: bun scripts/check-versions.mjs

      # Non-tag pushes / PRs: build only (no GitHub Release)
      - name: Build Tauri app
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: Extract changelog notes
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # windows-latest defaults to pwsh; these scripts are bash.
        shell: bash
        run: |
          # Redirect truncates the dest before python runs; mv only on success.
          # PYTHONUTF8=1: the changelog carries typographic quotes/em-dashes that
          # the Windows default codepage (cp1252) cannot decode.
          PYTHONUTF8=1 python3 scripts/generate-changelog.py --extract "$GITHUB_REF_NAME" --tag "$GITHUB_REF_NAME" > release-notes.md.tmp
          mv release-notes.md.tmp release-notes.md
          wc -l release-notes.md

      - name: Ensure GitHub Release with changelog
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Matrix jobs race on first create ("Release.tag_name already exists");
          # edit is the idempotent fallback, and a concurrent create can race
          # the edit too — retry a few times before giving up.
          ok=0
          for _ in 1 2 3 4 5; do
            if gh release create "$TAG" --title "AXIS $TAG" --notes-file release-notes.md 2>/dev/null || \
               gh release edit "$TAG" --title "AXIS $TAG" --notes-file release-notes.md 2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      # Version tags: build + attach to GitHub Release
      - name: Build Tauri app and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: AXIS ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Restore changelog on GitHub Release
        # always(): tauri-action may overwrite notes even when it fails.
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Best-effort: a sibling matrix job may be editing the same release
          # (HTTP 422 "Release.tag_name already exists") — never fail the job
          # over the restore.
          if [ -s release-notes.md ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axis-desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/*/release/bundle
          if-no-files-found: warn
          retention-days: 14

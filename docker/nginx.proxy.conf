# Drop-in same-origin Pro API reverse proxy for AXIS + pyne on one origin.
# Used by the `proxy` compose profile (nginx image + api service).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval' https://pyne-agent-worker.cryptolinx.workers.dev https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* https://axis.hoox.sh https://worker.axis.hoox.sh wss://worker.axis.hoox.sh https://pynescript.online wss://pynescript.online https://pynescript-axis.pages.dev https://*.pynescript-axis.pages.dev https://axis.pages.dev https://*.axis.pages.dev https://pyne-worker.cryptolinx.workers.dev wss://pyne-worker.cryptolinx.workers.dev https://pyne-agent-worker.cryptolinx.workers.dev https://api.binance.com https://data-api.binance.vision https://fapi.binance.com https://dapi.binance.com wss://stream.binance.com wss://stream.binance.com:9443 wss://data-stream.binance.vision wss://fstream.binance.com wss://dstream.binance.com https://api.mexc.com wss://wbs.mexc.com wss://wbs-api.mexc.com https://www.okx.com wss://ws.okx.com:8443 https://api.bybit.com wss://stream.bybit.com https://api.exchange.coinbase.com wss://advanced-trade-ws.coinbase.com wss://ws-feed.exchange.coinbase.com https://api.kraken.com wss://ws.kraken.com https://api.llama.fi https://api.geckoterminal.com https://api.coingecko.com https://api.github.com https://gitlab.com https://static.cloudflareinsights.com https://cloudflareinsights.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location /vendor/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location /pyodide/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location /plugins/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Pro API (pyne) — same origin eliminates CORS for browser POSTs
    location /run {
        proxy_pass http://api:8080/run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 32m;
    }

    location /ws/ {
        proxy_pass http://api:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Health / meta on API (PWA-only health is docker/nginx.conf)
    location /health {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        try_files /assets/icon-192.png =404;
    }

    location = /version.json {
        try_files /version.json =404;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}

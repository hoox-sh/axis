# SPA + long-cache hashed assets for AXIS dist/.
# Optional same-origin /run proxy when UPSTREAM_API is set via envsubst
# (compose.prod with nginx+api profile).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Wire transfer compression for JS/CSS/JSON/wasm (CF Pages does this at the edge)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Security headers (adjust CSP when proxying cross-origin APIs from the page)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Baseline CSP: self scripts + wasm for Pyodide; https/wss for venues/worker.
    # Remote plugins are allowlisted in loader (prod); keep script-src tight.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval' https://pyne-agent-worker.cryptolinx.workers.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;

    # CORS preflight — static host (do not 501 OPTIONS)
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        return 200 "ok\n";
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        return 200 "ok\n";
    }

    location = /favicon.ico {
        try_files /assets/icon-192.png =404;
    }

    # Hashed Vite assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Large wheels / pyodide — cache but revalidate
    location /vendor/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /pyodide/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /plugins/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Optional same-origin Pro API proxy (set in compose when api is on the network)
    # Uncomment via docker/nginx.proxy.conf include if needed.
    # location /run {
    #     proxy_pass http://api:8080/run;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 180s;
    #     client_max_body_size 32m;
    # }

    # SPA fallback — never rewrite real static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# SPA + long-cache hashed assets for AXIS dist/.
# Optional same-origin /run proxy when UPSTREAM_API is set via envsubst
# (compose.prod with nginx+api profile).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (adjust CSP when proxying cross-origin APIs from the page)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed Vite assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Large wheels / pyodide — cache but revalidate
    location /vendor/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /pyodide/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /plugins/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Optional same-origin Pro API proxy (set in compose when api is on the network)
    # Uncomment via docker/nginx.proxy.conf include if needed.
    # location /run {
    #     proxy_pass http://api:8080/run;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 180s;
    #     client_max_body_size 32m;
    # }

    # SPA fallback — never rewrite real static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

#
# AXIS local / demo stack (Docker Compose + Buildx bake-compatible).
#
# Quick start (PWA only — use pyodide or external API):
#   docker compose up --build
#   open http://127.0.0.1:8081
#
# With local PYNE Pro API (sister repo ../pynescript or PYNE_ROOT):
#   docker compose --profile api up --build
#   Settings → Engine server → http://127.0.0.1:5002
#
# Same-origin proxy (nginx + api, CORS-free /run):
#   docker compose --profile proxy up --build
#   open http://127.0.0.1:8080  (API at same origin /run)
#
# Production-ish (nginx image, no bind mounts):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Buildx bake (image only):
#   docker buildx bake pwa

name: axis

x-pwa-build: &pwa-build
  context: .
  dockerfile: Dockerfile
  target: pwa
  args:
    BUN_VERSION: ${BUN_VERSION:-1.3.14}
    GIT_SHA: ${GIT_SHA:-dev}
    VERSION: ${VERSION:-2.0.0}

services:
  # ── AXIS static PWA (python server, matches VPS axis-pwa) ───────────
  pwa:
    build:
      <<: *pwa-build
    image: ${AXIS_IMAGE:-axis-pwa:local}
    ports:
      - "${AXIS_PORT:-8081}:8081"
    environment:
      HOST: "0.0.0.0"
      PORT: "8081"
      AXIS_GIT_SHA: ${GIT_SHA:-dev}
      AXIS_VERSION: ${VERSION:-2.0.0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - axis

  # ── PYNE Pro API (optional) — build from sister repo ────────────────
  # Requires PYNE_ROOT (default ../pynescript) with its Dockerfile.
  api:
    profiles: ["api", "proxy"]
    build:
      context: ${PYNE_ROOT:-../pynescript}
      dockerfile: Dockerfile
      target: ${PYNE_TARGET:-api-dev}
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: ${PYNE_IMAGE:-pynescript-api:axis}
    ports:
      - "${API_PORT:-5002}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      FLASK_ENV: ${FLASK_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:8080,http://127.0.0.1:8080,http://pwa:8081}
      API_KEY_STORE: /data/api_keys.json
      PYTHONPATH: /app/src:/app
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - axis

  # ── nginx + same-origin /run proxy (optional) ───────────────────────
  proxy:
    profiles: ["proxy"]
    build:
      context: .
      dockerfile: Dockerfile
      target: pwa-nginx
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        GIT_SHA: ${GIT_SHA:-dev}
        VERSION: ${VERSION:-2.0.0}
    image: ${AXIS_NGINX_IMAGE:-axis-pwa-nginx:local}
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    # Own dist from pwa-nginx build; optional parallel python pwa on :8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - axis

networks:
  axis:
    driver: bridge

volumes:
  api_data:

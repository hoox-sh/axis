                0 0 0 0 1
                0 0 0 0.07 0"/>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="#050505"/>
  <rect width="1500" height="500" fill="url(#micro)"/>
  <rect width="1500" height="500" fill="url(#major)"/>
  <rect width="1500" height="500" filter="url(#monoNoise)"/>
  <g stroke="#FFFFFF" stroke-width="1.25" opacity="0.28" fill="none" stroke-linecap="square">
    <path d="M 12 28 V 12 H 28"/>
    <path d="M 1488 472 V 488 H 1472"/>
  </g>
  <g transform="translate(750.0,250.0)">

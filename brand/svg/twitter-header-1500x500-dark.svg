      <path d="M 76.80000000000001 -14.399999999999999 L 91.2 0 L 76.80000000000001 14.399999999999999"/>
      <path d="M -14.399999999999999 -76.80000000000001 L 0 -91.2 L 14.399999999999999 -76.80000000000001"/>
    </g>
    <text x="0" y="0" fill="#F5F5F5" font-family='"IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace' font-size="132.0" font-weight="500"
